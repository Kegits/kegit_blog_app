{% extends "portfolio/base.html" %}
{% block content %}
  <section class="content-section">
    <span class="eyebrow">This can’t be undone</span>
    <h1>Delete this story?</h1>
    <p class="form-help mb-4">You’re about to permanently delete <strong>“{{ object.title }}”</strong>.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete story</button>
      <a class="btn btn-outline-secondary ml-2" href="{% url 'post-detail' object.id %}">Keep story</a>
    </form>
  </section>
{% endblock content %}
