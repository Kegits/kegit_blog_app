{% extends "portfolio/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <section class="account-card">
    <div class="form-heading">
      <span class="eyebrow">You belong in this conversation</span>
      <h1>Join the community.</h1>
      <p>Create an account and share your perspective.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary btn-block" type="submit">Create your account</button>
    </form>
    <div class="border-top pt-3 mt-4">
      <small class="text-muted">Already have an account? <a href="{% url 'login' %}">Sign in</a></small>
    </div>
  </section>
{% endblock content %}
